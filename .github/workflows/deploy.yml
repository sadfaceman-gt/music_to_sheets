name: Deploy to GitHub Pages

# master deploys on push. Pushes to a cycle branch (cycle/<N>) also deploy, so the
# site is that cycle's review demo until it merges; the github-pages environment
# allows cycle/* under Settings > Environments. workflow_dispatch redeploys any
# branch by hand (GitHub only offers it once this file is on master).
on:
  push:
    branches: [master, 'cycle/*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
