name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:facts
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # CI runners have no audio device, so Firefox keeps its AudioContext suspended. A PulseAudio
      # server with a null sink gives it a silent output, as on a real machine.
      - name: Silent audio output for Firefox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      # The HT-Demucs model for the stems e2e (180.5 MB), downloaded once and kept in the Actions cache; the spec serves
      # it to the browser through a Playwright route.
      - name: Restore the HT-Demucs model
        id: demucs-model
        uses: actions/cache@v4
        with:
          path: test/htdemucs_embedded.onnx
          key: demucs-e5e425c1
      - name: Download the HT-Demucs model
        if: steps.demucs-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p test
          curl -L --fail --retry 3 -o test/htdemucs_embedded.onnx https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx
          echo "e5e425c17683f163a472462eb5f5a4ffcd11c31858d57fbd0833b012d8b88077  test/htdemucs_embedded.onnx" | sha256sum -c -
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
